<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        div {
            height: 200px;
            background-color: #660099;
            color: white;
        }
        body {
            display: grid;
            grid-template-columns: 1fr 20% 15% 20% 1fr;
            gap: 15px;
        }
        #one {
            background-color: #333333;
            grid-column: 2 / 5;
            text-align: center;
            font-size: 2em;
        }
        #two {
            background-color: #663300;
            grid-column: 3 / 4;
            grid-row: 2 / 4;
            text-align: center;
            font-size: 2em;
            height: 400px;
        }
    </style>
</head>
<body>
    <div id="one">hammer head</div>
    <div id="two">hammer handle</div>
</body>
</html>
